name: Hostinger'a Deploy Et

# main'e her push'ta Hostinger sunucusuna SSH ile bağlanıp `git pull` +
# gerekli build/migrate adımlarını çalıştırır. Kurulum adımları için
# deploy/HOSTINGER.md dosyasına bakın.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Backend'i güncelle (composer + migrate + cache)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.HOSTINGER_APP_PATH }}"
            git pull origin main
            cd backend
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan event:cache

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Frontend'i güncelle (npm build + Node App restart)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.HOSTINGER_APP_PATH }}"
            git pull origin main
            cd frontend
            npm ci
            npm run build
            # hPanel > Node.js App ekranındaki "Restart" tetikleyicisi genelde
            # bir dosyaya dokunmakla (Passenger konvansiyonu) tetiklenir.
            # Hostinger'ın kendi belgelerinde farklıysa bu satırı ona göre
            # güncelleyin (bkz. deploy/HOSTINGER.md).
            mkdir -p tmp && touch tmp/restart.txt
